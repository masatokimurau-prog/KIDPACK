[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidpack"
version = "0.1.0"
description = "Analysis tools for Kinetic Inductance Detectors (KID)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
kidpack-daq = "kidpack.daq.cli:main"

[project.optional-dependencies]
# NI-SCOPE driver bindings for the DAQ PC. The signal generator needs the
# site-specific `nirfsg` module (PXIe_5654); do not install PyPI's `nirfsg`.
daq = ["niscope"]
vacuum = ["pyserial"]
dev = ["pytest", "pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
