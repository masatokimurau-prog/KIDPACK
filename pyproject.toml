[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidpack"
version = "0.1.0"
description = "Analysis tools for Kinetic Inductance Detectors (KID)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
kidpack-daq = "kidpack.daq.cli:main"
kidpack-monitor = "kidpack.monitor.cli:main"
kidpack-iqscan = "kidpack.iqscan.cli:main"
kidpack-iqplot = "kidpack.iqscan.plot:main"

[project.optional-dependencies]
# NI driver bindings for the DAQ PC (they also need the NI-SCOPE / NI-RFSG drivers)
daq = ["niscope", "nirfsg"]
vacuum = ["pyserial"]
dev = ["pytest", "pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
