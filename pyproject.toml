[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidpack"
version = "0.1.0"
description = "Analysis tools for Kinetic Inductance Detectors (KID)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
kidpack-daq = "kidpack.daq.cli:main"
kidpack-monitor = "kidpack.monitor.cli:main"
kidpack-iqscan = "kidpack.iqscan.cli:main"
kidpack-iqplot = "kidpack.iqscan.plot:main"

[project.optional-dependencies]
# niscope binding for the DAQ PC. NI's `nirfsg` is deliberately NOT listed: the DAQ
# PC already has it, and kidpack must never install or upgrade it (it is imported at
# run time when the signal generator is used).
daq = ["niscope"]
vacuum = ["pyserial"]
dev = ["pytest", "pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
